name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
         accept-sdk-licenses: true

      - name: Find and extract project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Build debug APK
        run: |
          cd project
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KolonkaControl-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
