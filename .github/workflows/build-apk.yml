
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Java and Kotlin targets
        run: |
          FILE=$(find project -path '*/app/build.gradle.kts' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "app/build.gradle.kts not found"
            exit 1
          fi
          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: |
          SETTINGS=$(find project \( -name settings.gradle.kts -o -name settings.gradle \) -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KolonkaControl-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
